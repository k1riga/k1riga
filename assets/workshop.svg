<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">k1riga / Тут — не весь код.</title>
  <desc id="desc">Графитовая мастерская с янтарным хранилищем приватных проектов и открытым ящиком. По линии движется маленький пакет данных.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#363735"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V9" stroke="#F5B544" stroke-width="3"/>
    </pattern>
    <linearGradient id="metal" x1="785" y1="154" x2="1055" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#373832"/><stop offset="1" stop-color="#22241F"/>
    </linearGradient>
    <linearGradient id="paper" x1="722" y1="330" x2="941" y2="433" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD68A"/><stop offset="1" stop-color="#E5A02C"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1200" height="640" rx="16"/></clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .packet { animation: dispatch 7s ease-in-out infinite; }
      .status { animation: breathe 3.5s ease-in-out infinite; }
      .cursor { animation: cursor 1.4s step-end infinite; }
      @keyframes dispatch {
        0%, 12% { transform: translateX(0); opacity: 0; }
        18% { opacity: 1; }
        70% { transform: translateX(-330px); opacity: 1; }
        82%, 100% { transform: translateX(-330px); opacity: 0; }
      }
      @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes cursor { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .packet, .status, .cursor { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="640" fill="#181A18"/>
    <rect x="620" y="85" width="580" height="460" fill="url(#dots)"/>
    <!-- Window chrome, with a deliberately utilitarian index. -->
    <path d="M0 70H1200M0 551H1200" stroke="#3A3D35"/>
    <circle cx="33" cy="35" r="5" fill="#F5B544"/>
    <text class="mono" x="52" y="41" fill="#E6E5DC" font-size="17" font-weight="600">k1riga</text>
    <path d="M139 22V48" stroke="#494D40"/>
    <text class="mono" x="158" y="40" fill="#8F9587" font-size="13" letter-spacing="1.7">ЛИЧНОЕ ДЕЛО / DEV</text>
    <rect x="1026" y="21" width="143" height="28" rx="3" fill="#242A20" stroke="#48523C"/>
    <circle class="status" cx="1042" cy="35" r="3" fill="#C1D294"/>
    <text class="mono" x="1054" y="40" fill="#C1D294" font-size="11" letter-spacing="1.2">В РАЗРАБОТКЕ</text>
    <!-- Editorial headline, kept large enough to survive a narrow profile column. -->
    <text class="mono" x="40" y="130" fill="#9B9F92" font-size="13" letter-spacing="2">ВИДИМАЯ ЧАСТЬ РАБОТЫ</text>
    <text class="sans" x="34" y="239" fill="#EEEDE3" font-size="94" font-weight="700" letter-spacing="-5">Тут —</text>
    <text class="sans" x="34" y="338" fill="#F5B544" font-size="88" font-weight="700" letter-spacing="-4.5">не весь код.</text>
    <text class="sans" x="40" y="400" fill="#B9BDB0" font-size="22">Часть уже снаружи.</text>
    <text class="sans" x="40" y="433" fill="#B9BDB0" font-size="22">Остальное пока собираю внутри.</text>
    <path d="M42 483H74" stroke="#F5B544" stroke-width="2"/>
    <text class="mono" x="88" y="488" fill="#8F9587" font-size="12" letter-spacing="1.4">PUBLIC VIEW / PRIVATE WORK</text>
    <!-- A cabinet drawn in perspective: folders remain anonymous. -->
    <ellipse cx="895" cy="496" rx="229" ry="25" fill="#11130F"/>
    <path d="M748 155L989 120L1100 180L859 217Z" fill="#494D40" stroke="#737960" stroke-width="1.5"/>
    <path d="M989 120L1100 180V440L989 382Z" fill="#21251D" stroke="#59604B" stroke-width="1.5"/>
    <path d="M748 155L989 191V474L748 437Z" fill="url(#metal)" stroke="#6C735C" stroke-width="1.5"/>
    <path d="M989 191L1100 180V440L989 474Z" fill="#252A20" stroke="#59604B" stroke-width="1.5"/>
    <path d="M1005 218L1082 210M1005 233L1082 225M1005 248L1082 240" stroke="#404936" stroke-width="3"/>
    <path d="M1005 398L1082 378M1005 412L1082 392" stroke="#404936" stroke-width="3"/>
    <!-- Closed upper drawer. -->
    <path d="M764 179L972 211V283L764 251Z" fill="#22261E" stroke="#737960"/>
    <path d="M832 214L903 225V238L832 227Z" fill="#141711" stroke="#7B8369"/>
    <path d="M844 219L891 226" stroke="#A0A88B" stroke-width="2"/>
    <circle cx="951" cy="254" r="5" fill="#F5B544"/>
    <path d="M951 251V256" stroke="#211A0C" stroke-width="1.5"/>
    <!-- Folder tabs emerging from the open lower drawer. -->
    <path d="M774 300V261L820 267L832 280L935 297V345Z" fill="#797E68" stroke="#A5AC8E"/>
    <path d="M761 315V278L805 285L817 298L924 315V362Z" fill="#A6A88A" stroke="#CBD0B1"/>
    <path d="M748 332V298L793 305L805 318L913 335V379Z" fill="#DBCC9F" stroke="#E6DDBF"/>
    <path d="M782 295L811 299M771 313L800 317M761 333L788 337" stroke="#3B4032" stroke-width="4"/>
    <!-- Open amber drawer. -->
    <path d="M748 329L973 362L919 415L695 380Z" fill="#B77C25" stroke="#ECC06C" stroke-width="1.5"/>
    <path d="M695 353L918 386V459L695 425Z" fill="url(#paper)" stroke="#F9D48C" stroke-width="1.5"/>
    <path d="M918 386L973 336V407L918 459Z" fill="#BA7B20" stroke="#F9D48C" stroke-width="1.5"/>
    <path d="M695 353L748 303V329L720 356Z" fill="#E3A23C" stroke="#F9D48C"/>
    <path d="M755 388L838 400V414L755 402Z" fill="#25271F"/>
    <path d="M767 396L825 405" stroke="#F4C96F" stroke-width="2"/>
    <text class="mono" x="715" y="376" fill="#4C3718" font-size="10" letter-spacing="2" transform="rotate(8.5 715 376)">NOT FOR PUBLIC YET</text>
    <!-- Physical paper seal instead of a stock lock icon. -->
    <g transform="rotate(-8 1053 320)">
      <rect x="995" y="277" width="132" height="89" rx="2" fill="#E8E4CD"/>
      <path d="M1003 285H1119V359H1003Z" stroke="#7A7F65" stroke-dasharray="3 4"/>
      <text class="mono" x="1013" y="309" fill="#3B4032" font-size="11" letter-spacing="1.8">SOURCE CODE</text>
      <text class="mono" x="1009" y="336" fill="#24281E" font-size="22" font-weight="700" letter-spacing="1">PRIVATE</text>
      <path d="M1011 347H1109" stroke="#8A8F78"/>
    </g>
    <!-- A small dispatch line subtly animates. The base illustration works without motion. -->
    <path d="M1015 510H657" stroke="#6B705E" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path d="M667 505L657 510L667 515" stroke="#F5B544" stroke-width="1.5"/>
    <g class="packet"><rect x="1000" y="505" width="15" height="10" rx="1" fill="#F5B544"/></g>
    <path d="M1119 101H1143M1131 89V113M632 459H648M640 451V467" stroke="#737960"/>
    <!-- Bottom register. -->
    <rect x="0" y="552" width="1200" height="88" fill="#F0ECE0"/>
    <rect x="0" y="552" width="10" height="88" fill="#F5B544"/>
    <text class="mono" x="38" y="587" fill="#727466" font-size="11" letter-spacing="2">ТЕКУЩИЕ НАПРАВЛЕНИЯ</text>
    <text class="sans" x="37" y="617" fill="#292C25" font-size="21" font-weight="700">Склады / Приложения / E-commerce</text>
    <path d="M845 571V622" stroke="#C3C2B4"/>
    <text class="mono" x="873" y="588" fill="#727466" font-size="11" letter-spacing="2">ДОСТУП К КОДУ</text>
    <text class="mono" x="873" y="615" fill="#292C25" font-size="19">частичный</text>
    <rect class="cursor" x="1002" y="600" width="10" height="18" fill="#A16E14"/>
    <path d="M1092 575V618M1097 575V618M1105 575V618M1110 575V618M1114 575V618M1123 575V618M1129 575V618M1133 575V618M1142 575V618M1148 575V618M1152 575V618M1161 575V618" stroke="#474B3C" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="639" rx="15.5" stroke="#4A4E41"/>
</svg>
